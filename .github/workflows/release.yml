name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: dll
            runner: windows-latest
          - goos: linux
            goarch: amd64
            ext: so
            runner: ubuntu-latest
          - goos: darwin
            goarch: arm64
            ext: dylib
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache-dependency-path: go/go.sum
      - name: Build plugin
        working-directory: go
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          go build -trimpath -buildmode=c-shared -ldflags "-s -w -X main.pluginVersion=${version}" -o usage-keeper.${{ matrix.ext }} .
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $asset = "usage-keeper_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          $assetDir = Join-Path "dist" $asset
          $binary = "usage-keeper.${{ matrix.ext }}"
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          Copy-Item -LiteralPath (Join-Path "go" $binary) -Destination (Join-Path $assetDir $binary)
          Compress-Archive -LiteralPath (Join-Path $assetDir $binary) -DestinationPath (Join-Path "dist" "${asset}.zip") -CompressionLevel Optimal
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          asset="usage-keeper_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "dist/${asset}"
          cp "go/usage-keeper.${{ matrix.ext }}" "dist/${asset}/"
          (cd "dist/${asset}" && zip -q "../${asset}.zip" "usage-keeper.${{ matrix.ext }}")
      - uses: actions/upload-artifact@v5
        with:
          name: usage-keeper-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: usage-keeper-*
          path: release
          merge-multiple: true
      - name: Generate checksums
        working-directory: release
        run: |
          set -euo pipefail
          mapfile -t packages < <(find . -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort)
          test "${#packages[@]}" -gt 0
          sha256sum "${packages[@]}" > checksums.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_args=(--title "CLIProxyAPI Keeper ${RELEASE_TAG}" --generate-notes)
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" "${release_args[@]}" release/*.zip release/checksums.txt
