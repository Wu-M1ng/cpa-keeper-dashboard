name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      should_release: ${{ steps.tag.outputs.should_release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: tag
        name: Create release tag from registry version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(jq -r '.plugins[] | select(.id == "usage-keeper") | .version' registry.json)"
          release_tag="v${version}"
          if [[ ! "${release_tag}" =~ ^v[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "registry version must use MAJOR.MINOR.PATCH format: ${version}" >&2
            exit 1
          fi

          git fetch --force --tags origin
          if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            if gh release view "${release_tag}" >/dev/null 2>&1; then
              echo "Release ${release_tag} already exists; skipping"
              echo "should_release=false" >> "${GITHUB_OUTPUT}"
            else
              echo "Retrying release for existing tag ${release_tag}"
              echo "should_release=true" >> "${GITHUB_OUTPUT}"
            fi
          else
            echo "Creating tag ${release_tag} at ${GITHUB_SHA}"
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag --annotate "${release_tag}" "${GITHUB_SHA}" --message "Release ${release_tag}"
            git push origin "refs/tags/${release_tag}"
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
          fi
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

  build:
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: dll
            runner: windows-latest
          - goos: linux
            goarch: amd64
            ext: so
            runner: ubuntu-latest
          - goos: darwin
            goarch: arm64
            ext: dylib
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-release.outputs.release_tag }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache-dependency-path: go/go.sum
      - name: Build plugin
        working-directory: go
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          version="${RELEASE_TAG#v}"
          go build -trimpath -buildmode=c-shared -ldflags "-s -w -X main.pluginVersion=${version}" -o usage-keeper.${{ matrix.ext }} .
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $asset = "usage-keeper_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          $assetDir = Join-Path "dist" $asset
          $binary = "usage-keeper.${{ matrix.ext }}"
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          Copy-Item -LiteralPath (Join-Path "go" $binary) -Destination (Join-Path $assetDir $binary)
          Compress-Archive -LiteralPath (Join-Path $assetDir $binary) -DestinationPath (Join-Path "dist" "${asset}.zip") -CompressionLevel Optimal
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          version="${RELEASE_TAG#v}"
          asset="usage-keeper_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "dist/${asset}"
          cp "go/usage-keeper.${{ matrix.ext }}" "dist/${asset}/"
          (cd "dist/${asset}" && zip -q "../${asset}.zip" "usage-keeper.${{ matrix.ext }}")
      - uses: actions/upload-artifact@v6
        with:
          name: usage-keeper-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare-release, build]
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: usage-keeper-*
          path: release
          merge-multiple: true
      - name: Generate checksums
        working-directory: release
        run: |
          set -euo pipefail
          mapfile -t packages < <(find . -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort)
          test "${#packages[@]}" -gt 0
          sha256sum "${packages[@]}" > checksums.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          release_args=(--title "CLIProxyAPI Keeper ${RELEASE_TAG}" --generate-notes)
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          release_files=(release/*.zip release/checksums.txt)
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" --clobber "${release_files[@]}"
          else
            gh release create "${RELEASE_TAG}" "${release_args[@]}" "${release_files[@]}"
          fi
